[package]
name = "intakeguard-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
intakeguard-core = { path = "../../core" }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
